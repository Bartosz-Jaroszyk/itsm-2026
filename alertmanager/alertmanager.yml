global:
  resolve_timeout: 5m

route:
  receiver: chat
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="P1"']
      receiver: pager
    - matchers: ['severity="P2"']
      receiver: chat
    - matchers: ['severity="P3"']
      receiver: chat

receivers:
  - name: pager
    webhook_configs:
      - url: http://pager:8080/hook/pager
        send_resolved: true
  - name: chat
    webhook_configs:
      - url: http://pager:8080/hook/chat
        send_resolved: true

inhibit_rules:
  - source_matchers: ['alertname="KbSearchLatencyFastBurn"']
    target_matchers: ['alertname="KbSearchLatencySlowBurn"']
    equal: [cluster]
